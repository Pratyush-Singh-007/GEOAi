services:
  - type: web
    name: geoai-outdoor-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: USE_SLM=false uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: USE_SLM
        value: "false"
      - key: WAQI_TOKEN
        value: demo
